<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Ocean Boat Game</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #0077ff;
        font-family: Arial;
        touch-action: none;
    }

    canvas {
        display: block;
    }

    #ui {
        position: fixed;
        bottom: 20px;
        width: 100%;
        display: flex;
        justify-content: space-around;
    }

    button {
        width: 120px;
        height: 80px;
        font-size: 30px;
        border: none;
        border-radius: 15px;
        background: rgba(255,255,255,0.7);
    }

    #score {
        position: fixed;
        top: 10px;
        left: 10px;
        color: white;
        font-size: 20px;
    }
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="score">Score: 0</div>

<div id="ui">
    <button ontouchstart="moveLeft()">⬅️</button>
    <button ontouchstart="moveRight()">➡️</button>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Boat stays centered
const boat = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    w: 40,
    h: 70
};

let offsetX = 0;
let speed = 6;

let obstacles = [];
let score = 0;
let gameOver = false;

function spawn() {
    obstacles.push({
        x: Math.random() * canvas.width,
        y: -50,
        w: 50,
        h: 50,
        s: 3 + Math.random() * 3
    });
}

setInterval(spawn, 800);

function moveLeft() {
    offsetX += speed;
}

function moveRight() {
    offsetX -= speed;
}

function drawWater() {
    ctx.fillStyle = "#0077ff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    for (let i = 0; i < canvas.height; i += 40) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
    }
}

function drawBoat() {
    ctx.fillStyle = "yellow";
    ctx.fillRect(
        boat.x - boat.w / 2,
        boat.y - boat.h / 2,
        boat.w,
        boat.h
    );
}

function drawObstacles() {
    ctx.fillStyle = "brown";

    for (let o of obstacles) {
        let sx = o.x + offsetX;

        ctx.fillRect(sx, o.y, o.w, o.h);

        // collision
        if (
            sx < boat.x + boat.w / 2 &&
            sx + o.w > boat.x - boat.w / 2 &&
            o.y < boat.y + boat.h / 2 &&
            o.y + o.h > boat.y - boat.h / 2
        ) {
            gameOver = true;
        }

        o.y += o.s;
    }

    obstacles = obstacles.filter(o => o.y < canvas.height + 100);
}

function loop() {
    if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", canvas.width/2 - 120, canvas.height/2);
        return;
    }

    drawWater();
    drawBoat();
    drawObstacles();

    score++;
    document.getElementById("score").innerText = "Score: " + score;

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
